version: 2

builds:
  - binary: piper
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}.{{ .Arch }}"
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE.txt

release:
  draft: true
  name_template: "{{ .Version }}"
